[project]
name = "grupo-ofertas-telegram"
version = "0.1.0"
description = "Bot de ofertas para canal/grupo do Telegram com links de afiliado (Mercado Livre, Shopee, Amazon)"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "playwright>=1.47",
]

[tool.uv]
package = false
